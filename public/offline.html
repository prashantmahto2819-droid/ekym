<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>इंटरनेट नहीं है</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Mukta", sans-serif; background: #f6f7f8; color: #1f2937; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0b141a; color: #e5e7eb; } .card { background: #111b21 !important; } }
  .card { background: #fff; border-radius: 18px; padding: 28px 22px; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.3rem; margin: 14px 0 6px; }
  p { margin: 0 0 18px; opacity: .8; line-height: 1.5; }
  button { border: 0; border-radius: 999px; padding: 12px 22px; font-size: 1rem; background: #0f766e; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/pwa-192.png" alt="">
    <h1>इंटरनेट नहीं है</h1>
    <p>फोन का इंटरनेट / Wi-Fi जुड़ते ही पेज खुल जाएगा। जो पेज आपने पहले खोले थे, वे बिना इंटरनेट के भी खुल सकते हैं।</p>
    <button onclick="location.reload()">फिर से कोशिश करें</button>
  </div>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
