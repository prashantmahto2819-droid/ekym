# Weekly copy of Supabase Storage buckets (photos, letters, documents, publications …) to a Cloudflare R2 bucket.
# Secrets: SUPABASE_S3_ACCESS_KEY, SUPABASE_S3_SECRET_KEY (Supabase → Storage → Settings → S3 access keys),
#          R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID (Cloudflare → R2 → Manage API tokens), R2_BUCKET (name).
name: storage-backup
on:
  schedule:
    - cron: "30 22 * * 6"   # Sunday 04:00 IST
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Sync every bucket
        env:
          SB_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          SB_SECRET: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$SB_KEY" -a -n "$R2_KEY" || { echo "secrets missing"; exit 1; }
          cat > rclone.conf <<CFG
          [sb]
          type = s3
          provider = Other
          access_key_id = $SB_KEY
          secret_access_key = $SB_SECRET
          endpoint = https://udxdxkyfrqlgdwwqaucu.storage.supabase.co/storage/v1/s3
          region = ap-south-1
          force_path_style = true
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_KEY
          secret_access_key = $R2_SECRET
          endpoint = https://$R2_ACCOUNT.r2.cloudflarestorage.com
          CFG
          for b in $(rclone --config rclone.conf lsd sb: | awk '{print $NF}'); do
            echo "== $b"; rclone --config rclone.conf sync "sb:$b" "r2:$R2_BUCKET/$b" --fast-list --transfers 16 --stats-one-line || exit 1
          done
